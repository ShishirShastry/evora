# nginx in front of Evora (Evora on 127.0.0.1:8787), with HTTPS.
#
# Put this in /etc/nginx/sites-available/evora (or conf.d/evora.conf), replace
# evora.example.com and the certificate paths (certbot --nginx can make them),
# then: nginx -t && systemctl reload nginx
#
# Start Evora with:
#   EVORA_TRUST_PROXY=loopback        (nginx connects from 127.0.0.1; it appends the client to X-Forwarded-For)
#   EVORA_PUBLIC_URL=https://evora.example.com
# so that limits on repeated attempts count each client, not nginx, and
# "Continue with Google" may send people back to this address.

# Upgrade only requests that ask for it; others keep their connection to Evora.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream evora {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name evora.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name evora.example.com;

    ssl_certificate     /etc/letsencrypt/live/evora.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evora.example.com/privkey.pem;

    # Uploads (images, files) up to Evora's own limit (EVORA_MAX_UPLOAD_MB, 50 by default).
    client_max_body_size 64m;

    location / {
        proxy_pass http://evora;
        proxy_http_version 1.1;

        # WebSocket (/ws): pass the upgrade on.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        # Appends the client's address to whatever was there; Evora takes the right-most untrusted hop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Live connections stay open for hours; Evora pings every 15 s, so these are generous.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Large uploads go straight through.
        proxy_request_buffering off;
    }
}
