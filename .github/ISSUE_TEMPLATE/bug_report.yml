name: Bug report
description: Something in Evora does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. Please do not attach design files you are not allowed to share, and never paste passwords, tokens or session cookies.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new file
        2. Draw a rectangle
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where you run Evora
      options:
        - Desktop app (Windows)
        - Desktop app (macOS)
        - Desktop app (Linux)
        - In a browser, on this device only
        - In a browser, with a self-hosted server
        - From source (npm run dev)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Evora version
      description: The release you downloaded, or the commit you built from.
      placeholder: 0.1.0
  - type: input
    id: system
    attributes:
      label: Operating system and browser
      placeholder: Windows 11, Edge 142
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console output or a small file that shows it
