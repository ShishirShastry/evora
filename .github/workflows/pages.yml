# Website: publishes the static site in website/ to GitHub Pages
# (https://shishirshastry.github.io/evora/) whenever it changes on main, or by
# hand (Actions -> Website -> Run workflow). The site has no build step: the
# folder is uploaded as it is.
#
# Needs, once: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

# One deployment at a time; a newer push waits for the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Package the website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Pages lets browsers cache CSS and JS for 10 minutes. Stamping each
      # deploy's commit on the links makes a new page load its own styles,
      # not the previous deploy's.
      - name: Stamp the asset links
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -e "s|href=\"assets/site.css\"|href=\"assets/site.css?v=$v\"|" \
                 -e "s|src=\"assets/site.js\"|src=\"assets/site.js?v=$v\"|" website/index.html
          grep -q "site.css?v=$v" website/index.html
          grep -q "site.js?v=$v" website/index.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy to Pages
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
