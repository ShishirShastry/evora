# Dependabot only opens pull requests; nothing is merged or installed without a
# person reviewing it. CI runs on each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # The type definitions follow the Node that the app and CI run on (24),
      # so a newer major of @types/node would describe APIs that aren't there.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Minor and patch updates of development tools in one pull request.
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      # Minor and patch updates of what ships with the app in another.
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
