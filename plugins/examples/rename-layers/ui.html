<style>
  form { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
  .mode { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--evora-field); }
  .mode button { flex: 1; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--evora-dim); font: inherit; cursor: pointer; }
  .mode button[aria-pressed="true"] { background: var(--evora-bg); color: var(--evora-text); box-shadow: 0 0 0 1px var(--evora-line); }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--evora-dim); }
  input { height: 28px; padding: 0 8px; border: 1px solid var(--evora-line); border-radius: 6px; background: var(--evora-field); color: var(--evora-text); font: inherit; }
  input:focus { outline: 2px solid var(--evora-accent); outline-offset: -1px; }
  .row { display: flex; gap: 8px; }
  .row label { flex: 1; min-width: 0; }
  .hint, .count { margin: 0; color: var(--evora-dim); }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .actions button { height: 28px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--evora-line); background: var(--evora-field); color: var(--evora-text); font: inherit; cursor: pointer; }
  .actions button.primary { border-color: transparent; background: var(--evora-accent); color: #fff; }
  .actions button:disabled { opacity: 0.5; cursor: default; }
  [hidden] { display: none !important; }
</style>
<form id="form">
  <div class="mode" role="group" aria-label="Mode">
    <button type="button" id="mode-rename" aria-pressed="true">Rename</button>
    <button type="button" id="mode-replace" aria-pressed="false">Find and replace</button>
  </div>
  <div id="rename">
    <div class="row">
      <label>New name<input id="pattern" value="Layer $n" aria-label="New name"></label>
      <label style="flex: 0 0 64px">From<input id="start" type="number" value="1" aria-label="Start number"></label>
    </div>
    <p class="hint">$n is the layer's number, $&amp; its current name.</p>
  </div>
  <div id="replace" class="row" hidden>
    <label>Find<input id="find" aria-label="Find"></label>
    <label>Replace with<input id="with" aria-label="Replace with"></label>
  </div>
  <p class="count" id="count" aria-live="polite">No layers selected</p>
  <div class="actions">
    <button type="button" id="cancel">Close</button>
    <button type="submit" class="primary" id="apply" disabled>Rename</button>
  </div>
</form>
<script>
  const $ = (id) => document.getElementById(id);
  let mode = 'rename';
  let count = 0;
  const send = (message) => parent.postMessage({ pluginMessage: message }, '*');
  const update = () => {
    $('mode-rename').setAttribute('aria-pressed', String(mode === 'rename'));
    $('mode-replace').setAttribute('aria-pressed', String(mode === 'replace'));
    $('rename').hidden = mode !== 'rename';
    $('replace').hidden = mode !== 'replace';
    $('apply').disabled = count === 0 || (mode === 'replace' && !$('find').value);
    $('count').textContent = count === 0 ? 'No layers selected' : `${count} layer${count === 1 ? '' : 's'} selected`;
  };
  $('mode-rename').onclick = () => { mode = 'rename'; update(); };
  $('mode-replace').onclick = () => { mode = 'replace'; update(); };
  $('find').oninput = update;
  $('cancel').onclick = () => send({ type: 'cancel' });
  $('form').onsubmit = (event) => {
    event.preventDefault();
    if (mode === 'rename') send({ type: 'rename', pattern: $('pattern').value, start: Number($('start').value) || 0 });
    else send({ type: 'rename', find: $('find').value, replace: $('with').value });
  };
  window.onmessage = (event) => {
    const message = event.data && event.data.pluginMessage;
    if (message && message.type === 'selection') {
      count = message.count;
      update();
    }
  };
  update();
</script>
